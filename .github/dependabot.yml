version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let fresh releases settle (supply-chain hygiene)
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let fresh releases settle (supply-chain hygiene)
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let fresh releases settle (supply-chain hygiene)
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let fresh releases settle (supply-chain hygiene)
    commit-message:
      prefix: chore
      include: scope
    groups:
      pre-commit-hooks:
        patterns: ["*"]
