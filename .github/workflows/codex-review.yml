name: Codex review

# Codex reviews PRs against AGENTS.md ("Code Review Rules"). Runs when a PR is opened, reopened or
# marked ready, or when the `codex-review` label is added. It deliberately skips every push to
# avoid cost and noise; comment `@codex review` for ad-hoc reviews via the Codex GitHub integration.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'codex-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job holding the API key gets a read-only token; posting happens in a separate job.
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check for the OPENAI_API_KEY secret
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not set; skipping Codex review (see docs/github-setup.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Run Codex
        id: codex
        if: steps.key.outputs.present == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          permission-profile: ":read-only"

  comment:
    name: Post review
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### Codex review\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
