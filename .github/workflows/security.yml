name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect languages
        id: detect
        run: |
          languages='["actions","python"]'
          if compgen -G "apps/*/package.json" > /dev/null || compgen -G "packages/*/package.json" > /dev/null; then
            languages='["actions","javascript-typescript","python"]'
          fi
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: languages
    # Code scanning is free for public repositories; private ones need GitHub Advanced Security.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Audit Python dependencies (pip-audit)
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: Set up pnpm
        if: hashFiles('apps/*/package.json', 'packages/*/package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Audit npm dependencies (pnpm audit)
        if: hashFiles('apps/*/package.json', 'packages/*/package.json') != ''
        run: pnpm audit --prod
